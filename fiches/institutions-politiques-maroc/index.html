<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ملخصات مادة المؤسسات السياسية بالمغرب قابلة للطباعة أو الحفظ بصيغة PDF.">
<title>ملخص المؤسسات السياسية بالمغرب — Study BFA</title>
<link rel="stylesheet" href="/assets/studybfa-print.css?v=20261122">
</head><body>
<div class="toolbar"><a href="/matieres/institutions-politiques-maroc/">العودة إلى المادة</a><button id="save-pdf" type="button">طباعة / حفظ بصيغة PDF</button></div>
<main class="sheet">
<header><small>STUDY BFA · SEMESTRE 1</small><h1>المؤسسات السياسية بالمغرب</h1><p id="chapter-name"></p></header>
<div id="revision-sections"></div>
<footer>ملخص طلابي غير رسمي مستند إلى العرض الدراسي، مع تدقيق الإحالات الدستورية وفق دستور المملكة المغربية لسنة 2011. يُرجع إلى النص الدستوري الأصلي عند الاقتباس.</footer>
</main>
<script src="/assets/institutions-politiques-content.js?v=20261122-audit"></script><script src="/assets/institutions-politiques-synthese.js?v=20261122-audit"></script>
<script>
(()=>{'use strict';const data=window.STUDY_BFA_AI;
 const num=Number(new URLSearchParams(location.search).get('chapitre')||1);
 if(num===6){location.replace('/fiches/institutions-politiques-maroc/synthese/');return;}
 if(!Array.isArray(data)||!Number.isInteger(num)||num<1||num>data.length){
 document.getElementById('chapter-name').textContent='فصل غير متوفر';return;}
 const c=data[num-1];const heading=c.kind==='summary'?'الملخص الشامل للمادة':'الفصل '+num+' — '+c.title;
 document.title=heading+' | Study BFA';
 document.getElementById('chapter-name').textContent=heading;
 const root=document.getElementById('revision-sections');
 for(const [name,body] of c.notes){
  const sec=document.createElement('section');sec.className='section';
  const h=document.createElement('h2');h.textContent=name;
  const p=document.createElement('p');p.textContent=body;
  sec.append(h,p);root.append(sec);
 }
 document.getElementById('save-pdf').addEventListener('click',()=>window.print());
})();
</script></body></html>
